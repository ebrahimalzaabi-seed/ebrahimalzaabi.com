name: Refresh YouTube Videos Cache
on:
  schedule:
    - cron: '30 */1 * * *' # every hour at :30 (offset from tweets at :00)
  workflow_dispatch: # manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch YouTube RSS
        run: |
          curl -sf -o /tmp/yt_rss.xml "https://www.youtube.com/feeds/videos.xml?channel_id=UChYrhls3RB-rZru10I0EF2w"
          ENTRY_COUNT=$(grep -c '<entry>' /tmp/yt_rss.xml)
          echo "Fetched RSS with $ENTRY_COUNT entries"
          if [ "$ENTRY_COUNT" -eq 0 ]; then
            echo "::error::RSS returned 0 entries, aborting"
            exit 1
          fi

      - name: Parse RSS to JSON
        run: |
          python3 << 'PYEOF'
          import xml.etree.ElementTree as ET
          import json, datetime

          ns = {
              'atom': 'http://www.w3.org/2005/Atom',
              'yt': 'http://www.youtube.com/xml/schemas/2015',
              'media': 'http://search.yahoo.com/mrss/'
          }

          tree = ET.parse('/tmp/yt_rss.xml')
          root = tree.getroot()
          entries = root.findall('atom:entry', ns)[:6]

          now = datetime.datetime.now(datetime.timezone.utc)

          def relative_time(iso_str):
              dt = datetime.datetime.fromisoformat(iso_str)
              diff = now - dt
              days = diff.days
              if days == 0:
                  hours = diff.seconds // 3600
                  if hours == 0:
                      return 'just now'
                  return f'{hours} hour{"s" if hours != 1 else ""} ago'
              if days == 1:
                  return '1 day ago'
              if days < 7:
                  return f'{days} days ago'
              if days < 30:
                  weeks = days // 7
                  return f'{weeks} week{"s" if weeks != 1 else ""} ago'
              if days < 365:
                  months = days // 30
                  return f'{months} month{"s" if months != 1 else ""} ago'
              years = days // 365
              return f'{years} year{"s" if years != 1 else ""} ago'

          videos = []
          for entry in entries:
              vid = entry.find('yt:videoId', ns).text
              title = entry.find('atom:title', ns).text
              published = entry.find('atom:published', ns).text
              stats = entry.find('media:group/media:community/media:statistics', ns)
              views = stats.get('views', '') if stats is not None else ''

              videos.append({
                  'videoId': vid,
                  'title': title,
                  'url': f'https://www.youtube.com/watch?v={vid}',
                  'thumbnail': f'https://i.ytimg.com/vi/{vid}/hqdefault.jpg',
                  'views': views,
                  'publishedTime': relative_time(published),
              })

          output = {'success': True, 'videos': videos}
          with open('/tmp/youtube.json', 'w') as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f'Parsed {len(videos)} videos')
          for i, v in enumerate(videos):
              print(f'  [{i+1}] {v["title"]} ({v["publishedTime"]}, {v["views"]} views)')
          PYEOF

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Write to Cloudflare KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler kv key put "youtube_videos" --namespace-id="9e052ab39b5e4239a8d09bd4db481538" --remote --path /tmp/youtube.json
          echo "KV cache updated"
