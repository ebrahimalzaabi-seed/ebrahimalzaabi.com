name: Refresh YouTube Videos Cache
on:
  schedule:
    - cron: '30 */1 * * *' # every hour at :30 (offset from tweets at :00)
  workflow_dispatch: # manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest videos (RSS, falling back to channel page)
        run: python3 scripts/refresh-youtube.py /tmp/youtube.json

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Write to Cloudflare KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler kv key put "youtube_videos" --namespace-id="9e052ab39b5e4239a8d09bd4db481538" --remote --path /tmp/youtube.json
          echo "KV cache updated"
