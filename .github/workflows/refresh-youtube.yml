name: Refresh YouTube Videos Cache
on:
  schedule:
    - cron: '30 */1 * * *' # every hour at :30 (offset from tweets at :00)
  workflow_dispatch: # manual trigger

jobs:
  rss-test:
    runs-on: ubuntu-latest
    steps:
      - name: Test YouTube RSS from GH Actions
        run: |
          echo "--- Testing YouTube RSS feed ---"
          HTTP_CODE=$(curl -s -o /tmp/yt_rss.xml -w "%{http_code}" "https://www.youtube.com/feeds/videos.xml?channel_id=UChYrhls3RB-rZru10I0EF2w")
          echo "HTTP status: $HTTP_CODE"
          echo "Entry count: $(grep -c '<entry>' /tmp/yt_rss.xml)"
          echo "--- First 3 titles ---"
          grep '<title>' /tmp/yt_rss.xml | head -4
          echo "--- First 3 videoIds ---"
          grep '<yt:videoId>' /tmp/yt_rss.xml | head -3
          echo "--- First view counts ---"
          grep 'media:statistics' /tmp/yt_rss.xml | head -3

  refresh:
    runs-on: ubuntu-latest
    if: false  # temporarily disabled
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install youtubei.js

      - name: Fetch YouTube videos
        run: |
          node << 'JSEOF'
          const { Innertube } = require('youtubei.js');

          const CHANNEL_ID = 'UChYrhls3RB-rZru10I0EF2w';
          const MAX_VIDEOS = 6;

          async function main() {
            const yt = await Innertube.create();
            const channel = await yt.getChannel(CHANNEL_ID);
            const videosTab = await channel.getVideos();
            const videos = videosTab.videos.slice(0, MAX_VIDEOS);

            const output = {
              success: true,
              videos: videos.map(v => {
                const viewsRaw = v.short_view_count?.text || v.view_count?.text || '';
                const views = viewsRaw.replace(/\s*views?$/i, '').trim();
                return {
                  videoId: v.id,
                  title: v.title?.text || v.title,
                  url: `https://www.youtube.com/watch?v=${v.id}`,
                  thumbnail: `https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`,
                  views,
                  publishedTime: v.published?.text || '',
                  duration: v.duration?.text || '',
                };
              }),
            };

            const fs = require('fs');
            fs.writeFileSync('/tmp/youtube.json', JSON.stringify(output, null, 2));
            console.log(`Fetched ${output.videos.length} videos`);
            output.videos.forEach((v, i) => console.log(`  [${i+1}] ${v.title}`));
          }

          main().catch(err => {
            console.error('Error:', err.message);
            process.exit(1);
          });
          JSEOF

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Write to Cloudflare KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler kv key put "youtube_videos" --namespace-id="9e052ab39b5e4239a8d09bd4db481538" --remote --path /tmp/youtube.json
          echo "KV cache updated"
