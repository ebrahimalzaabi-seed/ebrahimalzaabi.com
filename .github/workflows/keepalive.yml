name: Keepalive Scheduled Workflows
# GitHub auto-disables scheduled workflows after 60 days without repo activity
# (this happened on 2026-07-03, silently freezing the tweets/YouTube caches).
# Re-enabling each workflow via the API resets that inactivity timer.
on:
  schedule:
    - cron: '0 5 * * 1' # weekly, Monday 05:00 UTC
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in keepalive.yml refresh-tweets.yml refresh-youtube.yml health-check.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" \
              && echo "✅ $wf enabled" \
              || { echo "::error::Failed to enable $wf"; exit 1; }
          done
