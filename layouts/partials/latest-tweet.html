<!-- Tweets Widget -->
<section id="tweet-widget" class="tweet-widget mt4" style="display:none;" data-worker-url="{{ if hugo.IsProduction }}{{ .Site.Params.workers.tweet.prod }}{{ else }}{{ .Site.Params.workers.tweet.dev }}{{ end }}">
  <div class="tweet-section-header">
    <span class="tweet-section-badge">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="tweet-section-badge-icon" aria-hidden="true"><path d="M389.2 48h70.6L305.6 224.2 487 464H345L233.7 318.6 106.5 464H35.8L200.7 275.5 26.8 48H172.4L272.9 180.9 389.2 48zM364.4 421.8h39.1L151.1 88h-42L364.4 421.8z"/></svg>
      <span class="arabic-text">تغريدات</span>
    </span>
  </div>
  <div class="tweet-layout" dir="rtl">
    <!-- Pinned Tweet (right side in RTL) -->
    <div id="tweet-pinned-col" class="tweet-pinned-col" style="display:none;"></div>
    <!-- Carousel (left side in RTL) -->
    <div class="tweet-carousel-col">
      <div class="tweet-carousel-wrapper">
        <div id="tweet-carousel" class="tweet-carousel"></div>
      </div>
      <div class="tweet-carousel-nav">
        <button id="tweet-nav-prev" class="tweet-nav-btn" aria-label="السابق">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <span id="tweet-nav-counter" class="tweet-nav-counter arabic-text"></span>
        <button id="tweet-nav-next" class="tweet-nav-btn" aria-label="التالي">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
      </div>
    </div>
  </div>
</section>

<!-- Tweet Modal -->
<div id="tweet-modal" class="tweet-modal" style="display:none;">
  <div class="tweet-modal-backdrop"></div>
  <div class="tweet-modal-content" dir="rtl">
    <button id="tweet-modal-close" class="tweet-modal-close" aria-label="إغلاق">&times;</button>
    <div id="tweet-modal-header" class="tweet-modal-profile"></div>
    <div id="tweet-modal-body" class="tweet-modal-body arabic-text"></div>
    <a id="tweet-modal-link" href="#" target="_blank" rel="noopener noreferrer" class="tweet-modal-btn arabic-text">
      المزيد..
    </a>
  </div>
</div>

<script>
(function() {
  var endpoint = document.getElementById("tweet-widget").dataset.workerUrl;
  var profileLink = 'https://x.com/ebrahimuae1';
  var xLogoSvg = '<svg class="tweet-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-label="X logo" role="img"><path d="M389.2 48h70.6L305.6 224.2 487 464H345L233.7 318.6 106.5 464H35.8L200.7 275.5 26.8 48H172.4L272.9 180.9 389.2 48zM364.4 421.8h39.1L151.1 88h-42L364.4 421.8z"/></svg>';
  var pinIconSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="tweet-pin-icon"><path d="M4.146.146A.5.5 0 0 1 4.5 0h7a.5.5 0 0 1 .5.5c0 .68-.342 1.174-.646 1.479-.126.125-.25.224-.354.298v4.431l.078.048c.203.127.476.314.751.555C12.36 7.775 13 8.527 13 9.5a.5.5 0 0 1-.5.5h-4v4.5a.5.5 0 0 1-1 0V10h-4a.5.5 0 0 1-.5-.5c0-.973.64-1.725 1.17-2.189a6 6 0 0 1 .83-.603v-4.43a2 2 0 0 1-.354-.299C4.342 1.674 4 1.179 4 .5a.5.5 0 0 1 .146-.354"/></svg>';

  function formatDate(dt) {
    if (!dt) return "";
    var d = new Date(dt);
    return d.toISOString().split("T")[0];
  }

  function toArabicNum(n) {
    var arabic = ["\u0660","\u0661","\u0662","\u0663","\u0664","\u0665","\u0666","\u0667","\u0668","\u0669"];
    return String(n).replace(/[0-9]/g, function(d) { return arabic[+d]; });
  }

  function profileHtml(p, t) {
    var h = "";
    if (p.imageUrl) h += '<a href="' + profileLink + '" target="_blank" rel="noopener noreferrer" class="tweet-avatar-link link dim"><img src="' + p.imageUrl + '" alt="' + (p.name || "") + '" class="tweet-profile-img" loading="lazy" referrerpolicy="no-referrer"/></a>';
    if (p.name) h += '<a href="' + profileLink + '" target="_blank" rel="noopener noreferrer" class="tweet-profile-name link dim">' + p.name + '</a>';
    if (p.handle) h += '<a href="' + profileLink + '" target="_blank" rel="noopener noreferrer" class="tweet-profile-handle link dim">' + p.handle + '</a>';
    if (t && t.datetime) {
      h += '<span class="tweet-meta-dot"> &middot; </span>';
      h += '<a href="' + (t.url || "#") + '" target="_blank" rel="noopener noreferrer" class="tweet-date link dim">' + formatDate(t.datetime) + '</a>';
    }
    return h;
  }

  function buildCard(tweet, profile, label, labelClass, isPinned) {
    var card = document.createElement("div");
    card.className = "tweet-card";

    var header = document.createElement("div");
    header.className = "tweet-card-header";

    var prof = document.createElement("div");
    prof.className = "tweet-profile";
    prof.innerHTML = (isPinned ? '<span class="tweet-pin-badge">' + pinIconSvg + '</span>' : '') + profileHtml(profile, tweet);

    header.appendChild(prof);

    var iconLink = document.createElement("a");
    iconLink.href = profileLink;
    iconLink.target = "_blank";
    iconLink.rel = "noopener noreferrer";
    iconLink.className = "tweet-icon-link link dim";
    iconLink.innerHTML = xLogoSvg;
    header.appendChild(iconLink);

    card.appendChild(header);

    var text = document.createElement("blockquote");
    text.className = "tweet-text arabic-text";
    text.textContent = tweet.text || "";
    card.appendChild(text);

    var showMore = document.createElement("button");
    showMore.className = "tweet-show-more arabic-text";
    showMore.textContent = "\u0639\u0631\u0636 \u0627\u0644\u0645\u0632\u064A\u062F";
    showMore.addEventListener("click", function() { openModal(tweet, profile); });
    card.appendChild(showMore);

    return card;
  }

  // -- Modal --
  var modal = document.getElementById("tweet-modal");
  var modalBackdrop = modal.querySelector(".tweet-modal-backdrop");
  var modalClose = document.getElementById("tweet-modal-close");
  var modalHeader = document.getElementById("tweet-modal-header");
  var modalBody = document.getElementById("tweet-modal-body");
  var modalLink = document.getElementById("tweet-modal-link");

  function openModal(tweet, profile) {
    modalHeader.innerHTML = '<div class="tweet-profile">' + profileHtml(profile, tweet) + '</div>';
    modalBody.textContent = tweet.text || "";
    modalLink.href = tweet.url || "#";
    modal.style.display = "flex";
    document.body.style.overflow = "hidden";
  }

  function closeModal() {
    modal.style.display = "none";
    document.body.style.overflow = "";
  }
  modalClose.addEventListener("click", closeModal);
  modalBackdrop.addEventListener("click", closeModal);
  document.addEventListener("keydown", function(e) { if (e.key === "Escape") closeModal(); });

  // -- Carousel --
  var currentSlide = 0;
  var totalSlides = 0;
  var carousel = document.getElementById("tweet-carousel");
  var resizeSyncTimer = null;

  function getVisibleFatwaCard() {
    var items = document.querySelectorAll('.homepage-top-col--fatwa .seasonal-fatwa-item');
    for (var i = 0; i < items.length; i++) {
      if (window.getComputedStyle(items[i]).display !== 'none') {
        return items[i].querySelector('.latest-fatawa-card');
      }
    }
    return null;
  }

  function syncFatwaCardHeight() {
    var row = document.getElementById('homepage-top-row');
    var tweetCol = document.querySelector('.homepage-top-col--tweet');
    var fatwaCard = getVisibleFatwaCard();

    if (row) row.style.visibility = 'visible';
    if (!tweetCol || !fatwaCard) return;

    var headerEl = document.querySelector('.homepage-top-col--fatwa .latest-fatawa-header');
    var headerH = headerEl ? headerEl.offsetHeight + parseFloat(getComputedStyle(headerEl).marginBottom) : 0;
    var maxHeight = Math.max(0, tweetCol.offsetHeight - headerH);
    fatwaCard.style.maxHeight = maxHeight + 'px';
  }

  function scheduleFatwaHeightSync() {
    syncFatwaCardHeight();
    window.requestAnimationFrame(syncFatwaCardHeight);
  }

  function goToSlide(idx) {
    if (idx < 0 || idx >= totalSlides) return;
    currentSlide = idx;
    carousel.style.transform = "translateX(" + (currentSlide * 100) + "%)";
    document.getElementById("tweet-nav-counter").textContent = toArabicNum(currentSlide + 1) + " / " + toArabicNum(totalSlides);
    document.getElementById("tweet-nav-prev").disabled = currentSlide === 0;
    document.getElementById("tweet-nav-next").disabled = currentSlide === totalSlides - 1;
    scheduleFatwaHeightSync();
    window.setTimeout(syncFatwaCardHeight, 420);
  }

  document.getElementById("tweet-nav-prev").addEventListener("click", function() { goToSlide(currentSlide - 1); });
  document.getElementById("tweet-nav-next").addEventListener("click", function() { goToSlide(currentSlide + 1); });

  // -- Fetch & Render --
  fetch(endpoint)
    .then(function(res) { return res.json(); })
    .then(function(data) {
      var p = data.profile || {};
      var tweets = data.tweets || [];
      var pinned = data.pinned || null;

      // Render pinned card
      if (pinned) {
        var pinnedCol = document.getElementById("tweet-pinned-col");
        var pinnedCard = buildCard(pinned, p, "\u062A\u063A\u0631\u064A\u062F\u0629 \u0645\u062B\u0628\u062A\u0629", "tweet-card-label--pinned", true);
        pinnedCol.appendChild(pinnedCard);
        pinnedCol.style.display = "";
      }

      // Render carousel tweets (skip if same as pinned)
      var carouselTweets = tweets.filter(function(t) { return !pinned || t.id !== pinned.id; });
      totalSlides = carouselTweets.length;

      carouselTweets.forEach(function(tweet, i) {
        var slide = document.createElement("div");
        slide.className = "tweet-carousel-slide";
        var card = buildCard(tweet, p, "\u062A\u063A\u0631\u064A\u062F\u0629 " + (i + 1), "tweet-card-label--latest", false);
        slide.appendChild(card);
        carousel.appendChild(slide);
      });

      if (totalSlides > 0) {
        goToSlide(0);
      }

      document.getElementById("tweet-widget").style.display = "";

      scheduleFatwaHeightSync();
      window.setTimeout(syncFatwaCardHeight, 120);
      window.setTimeout(syncFatwaCardHeight, 320);
    })
    .catch(function(err) {
      console.error("Tweet fetch error:", err);
      var row = document.getElementById('homepage-top-row');
      if (row) row.style.visibility = 'visible';
    });

  document.addEventListener('seasonalFatwa:updated', scheduleFatwaHeightSync);
  window.addEventListener('resize', function() {
    window.clearTimeout(resizeSyncTimer);
    resizeSyncTimer = window.setTimeout(syncFatwaCardHeight, 80);
  });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(scheduleFatwaHeightSync).catch(function() {});
  }
})();
</script>

<style>
  .tweet-widget {
    margin-bottom: 2rem;
  }
  .tweet-section-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 0;
    border-bottom: 2px solid #eee;
    padding-bottom: 0;
  }
  .tweet-section-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background-color: #9e6800;
    color: white;
    padding: 0.6rem 1.25rem;
    border-radius: 8px 8px 0 0;
    font-size: 1.2rem;
    font-weight: 700;
    margin-bottom: -2px;
  }
  .tweet-section-badge-icon {
    width: 1.1em;
    height: 1.1em;
    fill: currentColor;
  }
  /* Layout: pinned on top, carousel below */
  .tweet-layout {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    margin-top: 0.75rem;
  }
  .tweet-pinned-col {
    width: 100%;
  }
  .tweet-carousel-col {
    width: 100%;
  }
  .tweet-carousel-wrapper {
    overflow: hidden;
    border-radius: 12px;
  }
  .tweet-carousel {
    display: flex;
    transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    direction: ltr;
  }
  .tweet-carousel-slide {
    flex: 0 0 100%;
    min-width: 0;
    direction: rtl;
  }
  .tweet-carousel-slide .tweet-card {
    border-radius: 12px;
  }
  .tweet-carousel-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    margin-top: 0.6rem;
    direction: ltr;
  }
  .tweet-nav-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid #ddd;
    background: #fff;
    cursor: pointer;
    color: #555;
    transition: all 0.2s;
    padding: 0;
  }
  .tweet-nav-btn:hover:not(:disabled) {
    background: #f5f5f5;
    border-color: #9e6800;
    color: #9e6800;
  }
  .tweet-nav-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }
  .tweet-nav-counter {
    font-size: 0.85rem;
    color: #536471;
    min-width: 3rem;
    text-align: center;
  }
  /* Card */
  .tweet-card {
    background: #ffffff;
    border: 1px solid #e1e8ed;
    border-radius: 12px;
    padding: 1rem 1.25rem;
    transition: box-shadow 0.2s ease;
  }
  .tweet-card:hover {
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .tweet-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.5rem;
    overflow: hidden;
  }
  .tweet-pin-badge {
    display: inline-flex;
    align-items: center;
    color: #bbb;
    flex-shrink: 0;
    margin-left: -0.3rem;
  }
  .tweet-pin-icon {
    width: 1em;
    height: 1em;
  }
  .tweet-icon {
    width: 22px;
    height: 22px;
    fill: currentColor;
    color: #000;
    flex-shrink: 0;
  }
  .tweet-profile {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .tweet-profile-img {
    width: 36px;
    height: 36px;
    min-width: 36px;
    min-height: 36px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
  }
  .tweet-profile-name {
    font-size: 0.9rem;
    font-weight: 700;
    color: #0f1419;
    white-space: nowrap;
  }
  .tweet-profile-handle {
    font-size: 0.85rem;
    color: #536471;
    text-decoration: none;
    white-space: nowrap;
  }
  .tweet-meta-dot {
    color: #536471;
    font-size: 0.85rem;
    white-space: nowrap;
  }
  .tweet-date {
    font-size: 0.85rem;
    color: #536471;
    text-decoration: none;
    white-space: nowrap;
  }
  .tweet-icon-link {
    flex-shrink: 0;
  }
  .tweet-text {
    margin: 0;
    padding: 0;
    font-size: 1.15rem;
    line-height: 1.5;
    color: #0f1419;
    border: none;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .tweet-show-more {
    display: block;
    margin-top: 0.5rem;
    font-size: 0.9rem;
    color: #9e6800;
    font-weight: 600;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    font-family: inherit;
  }
  .tweet-show-more:hover {
    text-decoration: underline;
  }
  /* Modal */
  .tweet-modal {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .tweet-modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
  }
  .tweet-modal-content {
    position: relative;
    background: #fff;
    border-radius: 16px;
    padding: 1.5rem;
    max-width: 600px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: tweet-modal-in 0.25s ease-out;
  }
  @keyframes tweet-modal-in {
    from { opacity: 0; transform: scale(0.95) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .tweet-modal-close {
    position: absolute;
    top: 0.75rem;
    left: 1rem;
    right: auto;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: #f0f0f0;
    font-size: 1.3rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #555;
    line-height: 1;
    transition: background 0.2s;
  }
  .tweet-modal-close:hover {
    background: #ddd;
  }
  .tweet-modal-body {
    font-size: 1.2rem;
    line-height: 1.8;
    color: #0f1419;
    margin-top: 0.5rem;
    white-space: pre-wrap;
  }
  .tweet-modal-profile {
    margin-bottom: 0.75rem;
  }
  .tweet-modal-btn {
    display: inline-block;
    margin-top: 1rem;
    padding: 0.5rem 1.5rem;
    background: #9e6800;
    color: #fff;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 700;
    text-decoration: none;
    transition: background 0.2s;
  }
  .tweet-modal-btn:hover {
    background: #b08a3e;
    color: #fff;
  }
  @media (max-width: 640px) {
    .tweet-card {
      padding: 0.75rem 1rem;
    }
    .tweet-profile-name,
    .tweet-profile-handle {
      font-size: 0.8rem;
    }
    .tweet-profile-img {
      width: 30px;
      height: 30px;
    }
    .tweet-profile {
      overflow: hidden;
      flex-wrap: nowrap;
    }
    .tweet-text {
      font-size: 1rem;
    }
  }
  /* Dark mode */
  @media (prefers-color-scheme: dark) {
    .tweet-card {
      background: #1a1a1a;
      border-color: #333;
    }
    .tweet-card:hover {
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
    .tweet-profile-name {
      color: #e7e9ea;
    }
    .tweet-profile-handle {
      color: #71767b;
    }
    .tweet-text {
      color: #e7e9ea;
    }
    .tweet-date {
      color: #71767b;
    }
    .tweet-meta-dot {
      color: #71767b;
    }
    .tweet-icon {
      color: #e7e9ea;
    }
    .tweet-pin-badge {
      color: #666;
    }
    .tweet-nav-btn {
      background: #2a2a2a;
      border-color: #444;
      color: #aaa;
    }
    .tweet-nav-btn:hover:not(:disabled) {
      background: #333;
      border-color: #9e6800;
      color: #9e6800;
    }
    .tweet-nav-counter {
      color: #71767b;
    }
    .tweet-modal-content {
      background: #1a1a1a;
    }
    .tweet-modal-body {
      color: #e7e9ea;
    }
    .tweet-modal-close {
      background: #333;
      color: #ccc;
    }
    .tweet-modal-close:hover {
      background: #444;
    }
    .tweet-modal-btn {
      background: #9e6800;
      color: #fff;
    }
    .tweet-modal-btn:hover {
      background: #b08a3e;
    }
  }
</style>
