<style>
/* --- Mobile Header Bar --- */
.mobile-header {
  display: none; /* Hidden on desktop */
  align-items: center;
  justify-content: space-between;
  padding: 0.6rem 1rem;
  background: #fff;
  border-bottom: 2px solid #9e6800;
  position: sticky;
  top: 0;
  z-index: 1000;
}

.mobile-hamburger {
  background: none;
  border: none;
  cursor: pointer;
  padding: 0.3rem;
  color: #333;
  display: flex;
  align-items: center;
}

.mobile-header-title {
  font-size: 1.05rem;
  font-weight: 700;
  color: #2c3e50;
  text-align: center;
  flex: 1;
}

.mobile-hijri-date {
  font-size: 0.75rem;
  color: #888;
  white-space: nowrap;
}

/* --- Mobile Drawer --- */
.mobile-drawer-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 2000;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.mobile-drawer-overlay.open {
  display: block;
  opacity: 1;
}

.mobile-drawer {
  position: fixed;
  top: 0;
  right: -280px;
  width: 280px;
  height: 100%;
  background: #fff;
  z-index: 2001;
  transition: right 0.3s ease;
  overflow-y: auto;
  box-shadow: -4px 0 20px rgba(0,0,0,0.15);
}

.mobile-drawer.open {
  right: 0;
}

.mobile-drawer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 1.25rem;
  border-bottom: 2px solid #9e6800;
}

.mobile-drawer-title {
  font-size: 1.1rem;
  font-weight: 700;
  color: #2c3e50;
}

.mobile-drawer-close {
  background: none;
  border: none;
  font-size: 1.8rem;
  cursor: pointer;
  color: #666;
  line-height: 1;
  padding: 0;
}

.mobile-drawer-links {
  padding: 0.5rem 0;
}

.mobile-drawer-item {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.9rem 1.25rem;
  text-decoration: none;
  color: #333;
  font-size: 1rem;
  font-weight: 600;
  transition: background 0.15s ease;
  border-bottom: 1px solid #f0f0f0;
}

.mobile-drawer-item svg {
  color: #9e6800;
  flex-shrink: 0;
}

.mobile-drawer-item:hover,
.mobile-drawer-item.active {
  background: #fdf8f0;
  color: #9e6800 !important;
}

.mobile-drawer-item.active span {
  color: #9e6800 !important;
}

/* Dark mode */
@media (prefers-color-scheme: dark) {
  .mobile-header {
    background: #1e1e1e;
    border-bottom-color: #9e6800;
  }
  .mobile-hamburger {
    color: #e0e0e0;
  }
  .mobile-header-title {
    color: #e0e0e0;
  }
  .mobile-hijri-date {
    color: #888;
  }
  .mobile-drawer {
    background: #1e1e1e;
    box-shadow: -4px 0 20px rgba(0,0,0,0.4);
  }
  .mobile-drawer-header {
    border-bottom-color: #9e6800;
  }
  .mobile-drawer-title {
    color: #e0e0e0;
  }
  .mobile-drawer-close {
    color: #aaa;
  }
  .mobile-drawer-item {
    color: #e0e0e0;
    border-bottom-color: #333;
  }
  .mobile-drawer-item:hover,
  .mobile-drawer-item.active {
    background: #2e2a1e;
    color: #d4b06a;
  }
}

/* Show mobile header only on small screens */
@media screen and (max-width: 768px) {
  .mobile-header {
    display: flex;
  }
}
</style>

<script>
(function() {
  var hamburger = document.getElementById('mobile-hamburger');
  var drawer = document.getElementById('mobile-drawer');
  var overlay = document.getElementById('mobile-drawer-overlay');
  var closeBtn = document.getElementById('mobile-drawer-close');

  function openDrawer() {
    drawer.classList.add('open');
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeDrawer() {
    drawer.classList.remove('open');
    overlay.classList.remove('open');
    document.body.style.overflow = '';
  }

  if (hamburger) hamburger.addEventListener('click', openDrawer);
  if (closeBtn) closeBtn.addEventListener('click', closeDrawer);
  if (overlay) overlay.addEventListener('click', closeDrawer);

  // Mark active drawer item
  var path = decodeURIComponent(window.location.pathname);
  document.querySelectorAll('.mobile-drawer-item[data-nav-path]').forEach(function(el) {
    var navPath = el.getAttribute('data-nav-path');
    if (navPath === '/' && path === '/') {
      el.classList.add('active');
    } else if (navPath !== '/' && path.indexOf(navPath) === 0) {
      el.classList.add('active');
    }
  });

  // Sync hijri date to mobile header from the main hijri-date element
  document.addEventListener('DOMContentLoaded', function() {
    var srcEl = document.getElementById('hijri-date');
    var destEl = document.getElementById('mobile-hijri-date');
    if (!srcEl || !destEl) return;
    // Observe the main hijri date for changes (it's set async)
    var observer = new MutationObserver(function() {
      if (srcEl.textContent) {
        destEl.textContent = srcEl.textContent;
      }
    });
    observer.observe(srcEl, { childList: true, characterData: true, subtree: true });
    // In case it's already set
    if (srcEl.textContent) destEl.textContent = srcEl.textContent;
  });
})();
</script>
